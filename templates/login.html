<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - CineWave</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="bg-[#0F1016] text-slate-100 font-sans min-h-screen flex items-center justify-center p-6">

  <div class="glass-card rounded-3xl p-8 w-full max-w-md space-y-6">
    <div class="text-center space-y-2">
      <h1 class="text-3xl font-black tracking-wider text-white">CINE<span class="text-[#FF2E63]">WAVE</span></h1>
      <p class="text-xs text-slate-400">Sign in to your account</p>
    </div>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="p-3 rounded-xl bg-[#FF2E63]/10 border border-[#FF2E63]/30 text-[#FF2E63] text-xs text-center">
          {{ messages[0] }}
        </div>
      {% endif %}
    {% endwith %}

    <form method="POST" class="space-y-4">
      <div>
        <label class="block text-xs text-slate-400 font-medium mb-1">Username</label>
        <input type="text" name="username" required class="w-full bg-slate-900 border border-slate-700/60 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-[#FF2E63]">
      </div>

      <div>
        <label class="block text-xs text-slate-400 font-medium mb-1">Password</label>
        <input type="password" name="password" required class="w-full bg-slate-900 border border-slate-700/60 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-[#FF2E63]">
      </div>

      <button type="submit" class="w-full py-3 bg-[#FF2E63] hover:bg-rose-600 text-white font-semibold text-sm rounded-xl transition shadow-lg shadow-rose-600/30">
        Sign In
      </button>
    </form>

    <p class="text-xs text-center text-slate-400">
      Don't have an account? <a href="{{ url_for('register') }}" class="text-[#FF2E63] font-semibold hover:underline">Register</a>
    </p>
  </div>
</body>
</html>
