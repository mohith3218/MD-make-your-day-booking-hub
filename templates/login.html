<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - MD CineWave</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: Manrope, sans-serif; background: radial-gradient(ellipse at 18% 12%, rgba(201,168,76,.13), transparent 32%), radial-gradient(ellipse at 90% 84%, rgba(16,105,132,.17), transparent 42%), linear-gradient(135deg, #0d0d0d 0%, #17151b 55%, #0b0c10 100%); background-attachment: fixed; }
    h1 { font-family: "Bebas Neue", sans-serif; letter-spacing: .04em; }
    .glass-card { background: rgba(13,13,13,.76); backdrop-filter: blur(18px); border: 1px solid rgba(201,168,76,.22); }
  </style>
</head>
<body class="bg-[#0F1016] text-slate-100 font-sans min-h-screen flex items-center justify-center p-6">

  <div class="glass-card rounded-3xl p-8 w-full max-w-md space-y-6">
    <div class="text-center space-y-2">
      <h1 class="text-4xl tracking-wider text-amber-100">MD CINE WAVE</h1>
      <p class="text-xs text-slate-400">Sign in to your account</p>
    </div>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="p-3 rounded-xl bg-[#C9A84C]/10 border border-[#C9A84C]/30 text-[#C9A84C] text-xs text-center">
          {{ messages[0] }}
        </div>
      {% endif %}
    {% endwith %}

    <form method="POST" class="space-y-4">
      <div>
        <label class="block text-xs text-slate-400 font-medium mb-1">Username</label>
        <input type="text" name="username" required class="w-full bg-slate-900 border border-slate-700/60 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-[#C9A84C]">
      </div>

      <div>
        <label class="block text-xs text-slate-400 font-medium mb-1">Password</label>
        <input type="password" name="password" required class="w-full bg-slate-900 border border-slate-700/60 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-[#C9A84C]">
      </div>

      <button type="submit" class="w-full py-3 bg-[#C9A84C] hover:bg-amber-600 text-white font-semibold text-sm rounded-xl transition shadow-lg shadow-amber-600/30">
        Sign In
      </button>
    </form>

    <p class="text-xs text-center text-slate-400">
      Don't have an account? <a href="{{ url_for('register') }}" class="text-[#C9A84C] font-semibold hover:underline">Register</a>
    </p>
  </div>
</body>
</html>
