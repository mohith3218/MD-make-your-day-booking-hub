{% extends "base.html" %}
{% block title %}Register · MD CineWave{% endblock %}

{% block content %}
<div class="max-w-md mx-auto glass-card rounded-3xl p-8 space-y-6">
  <div class="text-center space-y-2">
    <h1 class="text-3xl font-black tracking-wider text-white">MD CINE<span class="text-[#C9A84C]">WAVE</span></h1>
    <p class="text-xs text-slate-400">Create your account</p>
    <p class="text-[11px] text-emerald-400">Create your account and start booking movies.</p>
  </div>

  <form method="POST" class="space-y-4">
    <div>
      <label class="block text-xs text-slate-400 font-medium mb-1">Username</label>
      <input type="text" name="username" minlength="3" maxlength="30" pattern="[A-Za-z0-9_.-]+" autocomplete="username" required class="w-full bg-slate-900 border border-slate-700/60 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-[#C9A84C]">
    </div>
    <div>
      <label class="block text-xs text-slate-400 font-medium mb-1">Email</label>
      <input type="email" name="email" autocomplete="email" maxlength="120" required class="w-full bg-slate-900 border border-slate-700/60 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-[#C9A84C]">
    </div>
    <div>
      <label class="block text-xs text-slate-400 font-medium mb-1">Mobile number</label>
      <input type="tel" name="phone" pattern="[0-9]{10}" placeholder="10 digit mobile" class="w-full bg-slate-900 border border-slate-700/60 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-[#C9A84C]">
    </div>
    <div>
      <label class="block text-xs text-slate-400 font-medium mb-1">Password</label>
      <input type="password" name="password" minlength="6" maxlength="256" autocomplete="new-password" required class="w-full bg-slate-900 border border-slate-700/60 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-[#C9A84C]">
    </div>
    <button type="submit" class="w-full py-3 bg-[#C9A84C] hover:bg-amber-600 text-white font-semibold text-sm rounded-xl transition shadow-lg shadow-amber-600/30">Create account</button>
  </form>

  <p class="text-xs text-center text-slate-400">
    Already have an account? <a href="{{ url_for('login') }}" class="text-[#C9A84C] font-semibold hover:underline">Sign in</a>
  </p>
</div>
{% endblock %}
