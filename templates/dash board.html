<!DOCTYPE html>
<html>
<head>
    <title>My Bookings</title>
</head>
<body>
    <h1>My Bookings</h1>
    <p><a href="{{ url_for('home') }}">← Back to Home</a></p>

    {% if bookings %}
        {% for b in bookings %}
            <div style="border: 1px solid #ccc; padding: 15px; margin: 10px 0;">
                <h3>{{ b.movie }}</h3>
                <p>Theater: {{ b.theater }}</p>
                <p>Date: {{ b.date }} | Time: {{ b.time }}</p>
                <p>Seats: {{ b.seats }}</p>
                <p>Status: {{ b.status }}</p>
            </div>
        {% endfor %}
    {% else %}
        <p>You have no bookings yet.</p>
    {% endif %}
</body>
</html>
