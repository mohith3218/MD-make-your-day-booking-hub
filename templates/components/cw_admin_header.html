<header class="cw-admin-header">
  <div class="cw-container cw-admin-header-inner">
    <a href="{{ url_for('admin.admin') }}" class="cw-brand" aria-label="MD CineWave admin dashboard"><span class="cw-logo"><i class="fa-solid fa-clapperboard" aria-hidden="true"></i></span><span>CineWave</span><span class="cw-admin-label">ADMIN</span></a>
    <button id="cw-menu-toggle" class="cw-menu-toggle" type="button" aria-controls="cw-main-nav" aria-expanded="false" aria-label="Open administration navigation"><i class="fa-solid fa-bars" aria-hidden="true"></i><span>Admin menu</span></button>
    <nav id="cw-main-nav" class="cw-nav cw-admin-nav" aria-label="Administration">
      <a href="{{ url_for('admin.admin') }}" {% if request.endpoint == 'admin.admin' %}aria-current="page"{% endif %}>Dashboard</a>
      <a href="{{ url_for('admin.admin') }}#movies">Movies</a>
      <a href="{{ url_for('admin.screens') }}" {% if request.endpoint in ('admin.screens', 'admin.add_theater', 'admin.add_screen', 'admin.edit_layout', 'admin.edit_auditorium_reference') %}aria-current="page"{% endif %}>Theatres &amp; screens</a>
      <a href="{{ url_for('admin.add_showtime') }}" {% if request.endpoint == 'admin.add_showtime' %}aria-current="page"{% endif %}>Showtimes</a>
      <a href="{{ url_for('admin.admin_bookings') }}" {% if request.endpoint == 'admin.admin_bookings' %}aria-current="page"{% endif %}>Bookings</a>
      <a href="{{ url_for('screen_reviews.moderation') }}" {% if request.endpoint == 'screen_reviews.moderation' %}aria-current="page"{% endif %}>Screen reviews</a>
      <a href="{{ url_for('movie_reviews.moderation') }}" {% if request.endpoint == 'movie_reviews.moderation' %}aria-current="page"{% endif %}>Movie reviews</a>
      <a href="{{ url_for('admin.admin_analytics') }}" {% if request.endpoint in ('admin.admin_analytics', 'admin.admin_analytics_export') %}aria-current="page"{% endif %}>Analytics</a>
      <a href="{{ url_for('admin.admin_recharges') }}" {% if request.endpoint == 'admin.admin_recharges' %}aria-current="page"{% endif %}>Recharges</a>
    </nav>
    <div class="cw-admin-actions">
      {% include "components/theme_menu.html" %}
      <a class="cw-admin-site-link" href="{{ url_for('main.home') }}"><i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i> View site</a>
      <form method="POST" action="{{ url_for('auth.logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="cw-admin-logout" type="submit">Sign out</button></form>
    </div>
  </div>
</header>
