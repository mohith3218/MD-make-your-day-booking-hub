name: Sync TMDB movie catalogue

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cinewave-tmdb-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: production
      TMDB_REGION: ${{ vars.TMDB_REGION || 'IN' }}
      TMDB_SYNC_INTERVAL_MINUTES: ${{ vars.TMDB_SYNC_INTERVAL_MINUTES || '360' }}
      TMDB_SYNC_LOOKBACK_DAYS: ${{ vars.TMDB_SYNC_LOOKBACK_DAYS || '45' }}
      TMDB_SYNC_LOOKAHEAD_DAYS: ${{ vars.TMDB_SYNC_LOOKAHEAD_DAYS || '180' }}
      TMDB_SYNC_MAX_PAGES: ${{ vars.TMDB_SYNC_MAX_PAGES || '25' }}
    steps:
      - name: Check configuration
        id: configured
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.CINEWAVE_SYNC_DATABASE_URL }}
          TMDB_API_KEY: ${{ secrets.CINEWAVE_SYNC_TMDB_API_KEY }}
          TMDB_READ_TOKEN: ${{ secrets.CINEWAVE_SYNC_TMDB_READ_TOKEN }}
        run: |
          if [[ -n "$DATABASE_URL" && ( -n "$TMDB_READ_TOKEN" || -n "$TMDB_API_KEY" ) ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Configure the CineWave sync database and TMDB secrets to enable this job."
          fi
      - if: steps.configured.outputs.ready == 'true'
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - if: steps.configured.outputs.ready == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - if: steps.configured.outputs.ready == 'true'
        run: python -m pip install -r requirements.txt
      - if: steps.configured.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.CINEWAVE_SYNC_DATABASE_URL }}
          TMDB_API_KEY: ${{ secrets.CINEWAVE_SYNC_TMDB_API_KEY }}
          TMDB_READ_TOKEN: ${{ secrets.CINEWAVE_SYNC_TMDB_READ_TOKEN }}
        run: python -m flask --app app sync-movies
