<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CineVR — Real-Time 3D Auditorium & Seat Preview</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js r128 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter & Space Grotesk -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-neo:#0d1017; --panel-neo:rgba(17,21,32,0.86); --cyan-glow:#00f2fe; --purple-glow:#8a2be2; --gold-glow:#f59e0b; }
        *{user-select:none;-webkit-user-select:none;box-sizing:border-box;}
        body,html{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#06080c;font-family:'Inter',sans-serif;color:#e2e8f0;}
        .font-display{font-family:'Space Grotesk',sans-serif;}
        .neo-panel{background:var(--panel-neo);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.07);box-shadow:8px 8px 24px rgba(0,0,0,0.75),-4px -4px 16px rgba(255,255,255,0.025),inset 0 1px 1px rgba(255,255,255,0.08);}
        .neo-inset{background:#090c12;box-shadow:inset 4px 4px 9px rgba(0,0,0,0.85),inset -2px -2px 6px rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.04);}
        .neo-btn{background:linear-gradient(145deg,#161b28,#0f131c);box-shadow:4px 4px 10px rgba(0,0,0,0.65),-2px -2px 6px rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);transition:all 0.2s cubic-bezier(0.16,1,0.3,1);}
        .neo-btn:hover{border-color:rgba(0,242,254,0.4);color:#fff;transform:translateY(-1px);}
        .neo-btn:active,.neo-btn.active{background:linear-gradient(145deg,#0b0e15,#141925);box-shadow:inset 3px 3px 7px rgba(0,0,0,0.8),0 0 12px rgba(0,242,254,0.25);border-color:rgba(0,242,254,0.65);color:#00f2fe;}
        input[type=range]{-webkit-appearance:none;background:transparent;}
        input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:999px;background:#080b11;box-shadow:inset 2px 2px 4px rgba(0,0,0,0.9);border:1px solid rgba(255,255,255,0.06);}
        input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;height:16px;width:16px;border-radius:50%;background:#00f2fe;box-shadow:0 0 10px #00f2fe;margin-top:-6px;cursor:pointer;transition:transform 0.15s ease;}
        input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.2);}
        .seat-dot{transition:all 0.18s cubic-bezier(0.34,1.56,0.64,1);}
        .seat-dot:hover:not(.occupied){transform:scale(1.25);z-index:10;}
        #vr-stereo-overlay{pointer-events:none;display:none;}
        #vr-stereo-overlay.active{display:flex;}
        ::-webkit-scrollbar{width:5px;height:5px;}
        ::-webkit-scrollbar-track{background:#090c12;}
        ::-webkit-scrollbar-thumb{background:#263044;border-radius:9999px;}
        @keyframes pulseGlow{0%,100%{opacity:0.7;}50%{opacity:1;}}
        .animate-glow{animation:pulseGlow 2.4s infinite ease-in-out;}
    </style>
</head>
<body class="relative w-screen h-screen overflow-hidden select-none">
    <div id="canvas-container" class="absolute inset-0 w-full h-full cursor-grab active:cursor-grabbing"></div>
    <!-- Rest of the original HTML omitted for brevity -->
    <script>
        // Original script content (same as provided) ...
    </script>
</body>
</html>
